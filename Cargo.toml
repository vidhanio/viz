[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/vidhanio/viz"
publish = false

# Name for crane's workspace-wide derivations (dependency artifacts, clippy, tests).
[workspace.metadata.crane]
name = "viz"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
clap = "4"
futures-util = { version = "0.3", default-features = false }
# Lucide's SVGs as `const` strings: the desktop's only icon set (docs/design.md).
lucide-static-svg = "1.76"
mime_guess = "2"
notify-rust = { version = "4", default-features = false }
rfd = "0.18"
rustls = { version = "0.23", default-features = false }
serde = "1"
# Base16 scheme files (tinted-theming YAML) for the desktop's themes.
serde-saphyr = { version = "2", default-features = false, features = [
  "deserialize",
] }
serde_json = "1"
serenity = { version = "0.12", default-features = false }
thiserror = "2"
tokio = "1"
tokio-tungstenite = "0.28"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"
unicode-segmentation = "1"

viz-client = { path = "crates/viz-client" }
viz-config = { path = "crates/viz-config" }

# Rune is unpublished: pin a `dev` revision and replicate its `[patch.crates-io]` below at the same rev.
rune = { git = "https://github.com/anomalyco/rune", rev = "0d00d3f2d59df5b764d8d6b2585164fd43c16f48" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "0d00d3f2d59df5b764d8d6b2585164fd43c16f48" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "0d00d3f2d59df5b764d8d6b2585164fd43c16f48" }

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
multiple_crate_versions = "allow"
undocumented_unsafe_blocks = "warn"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "deny"

# Cargo doesn't inherit `[patch]` from dependencies: mirror Rune's root `Cargo.toml` at the pinned rev.
# Update every `rev` together with `workspace.dependencies.rune`.
[patch.crates-io]
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "0d00d3f2d59df5b764d8d6b2585164fd43c16f48" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "0d00d3f2d59df5b764d8d6b2585164fd43c16f48" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "0d00d3f2d59df5b764d8d6b2585164fd43c16f48" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "0d00d3f2d59df5b764d8d6b2585164fd43c16f48" }
winit = { git = "https://github.com/anomalyco/rune", rev = "0d00d3f2d59df5b764d8d6b2585164fd43c16f48" }
