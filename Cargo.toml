[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/vidhanio/viz"
publish = false

[workspace.metadata.crane]
name = "viz"

[workspace.dependencies]
agent-client-protocol = "~5.5.0"
async-trait = "0.1"
anyhow = "1"
axum = "0.8"
base64 = "0.23"
cap-std = "4"
chrono = { version = "0.4", default-features = false }
clap = "4"
fontique = { version = "0.12", default-features = false, features = [
  "std",
  "system",
  "fontconfig-dlopen",
] }
futures-util = { version = "0.3", default-features = false }
futures = "0.3"
git2 = { version = "0.21", default-features = false }
http = "1"
http-body-util = "0.1"
ignore = "0.4"
jsonrpsee-types = "0.26"
libc = "0.2"
listenfd = "1"
lucide-static-svg = "1.77"
mime_guess = "2"
notify = "8"
nucleo-matcher = "0.3"
octocrab = { version = "0.54", default-features = false, features = [
  "default-client",
  "rustls",
  "rustls-ring",
] }
notify-rust = { version = "4", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
reqwest = { version = "0.13", default-features = false }
rmcp = "3.11"
rfd = { version = "0.18", default-features = false }
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
rustix = "1"
rustls = { version = "0.23", default-features = false }
schemars = "1"
sd-notify = "0.5"
serde = "1"
serde-saphyr = { version = "2", default-features = false, features = [
  "deserialize",
] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = "1"
tokio-tungstenite = "0.30"
tokio-util = "0.7"
toml = "1.2"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
uuid = "1"
wgpu = { version = "30", default-features = false }

viz-acp = { path = "crates/viz-acp" }
viz-client = { path = "crates/viz-client" }
viz-config = { path = "crates/viz-config" }
viz-fs = { path = "crates/viz-fs" }
viz-git = { path = "crates/viz-git" }
viz-github = { path = "crates/viz-github" }
viz-core = { path = "crates/viz-core" }
viz-protocol = { path = "crates/viz-protocol" }

rune = { git = "https://github.com/anomalyco/rune", branch = "dev" }
rune-fx = { git = "https://github.com/anomalyco/rune", branch = "dev" }
rune-kit = { git = "https://github.com/anomalyco/rune", branch = "dev" }
rune-notify = { git = "https://github.com/anomalyco/rune", branch = "dev" }

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
multiple_crate_versions = "allow"
undocumented_unsafe_blocks = "warn"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "deny"

[patch.crates-io]
accesskit_macos = { git = "https://github.com/anomalyco/rune", branch = "dev" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", branch = "dev" }
parley_engine = { git = "https://github.com/anomalyco/rune", branch = "dev" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", branch = "dev" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", branch = "dev" }
winit = { git = "https://github.com/anomalyco/rune", branch = "dev" }
