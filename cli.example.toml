# Copy to cli.toml in $VIZ_CONFIG_DIR or $XDG_CONFIG_HOME/viz (default ~/.config/viz).
# --config overrides $VIZ_CLI_CONFIG, then the default path. No config.d/ layers;
# a missing file uses defaults. `viz config` lists component paths and whether
# they exist, but reads only the CLI file and shows its connection with the token redacted.
[backend]
# Default: $XDG_RUNTIME_DIR/viz/backend.sock, or backend.sock in $STATE_DIRECTORY
# or $XDG_STATE_HOME/viz (default ~/.local/state/viz) if runtime dir is unset.
# For a custom socket, use the same path as the backend's [backend].socket.
# socket = "/run/user/1000/viz/backend.sock"
# Remote base URL and bearer token both default to unset. A URL takes precedence
# over the socket and requires an explicit client token (no backend config fallback).
# url = "https://viz-host.tailnet.ts.net"
# Secrets accept "inline", { file = "/run/secrets/x" } (one trailing line ending
# is removed), or { env = "NAME" }.
# token = { file = "/run/secrets/viz-token" }
