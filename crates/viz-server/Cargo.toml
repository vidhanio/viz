[package]
name = "viz-server"
description = "Durable ACP threads and delegation across viz environments"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
agent-client-protocol.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
clap = { workspace = true, features = ["derive"] }
config.workspace = true
futures.workspace = true
futures-util = { workspace = true, features = ["sink"] }
git2.workspace = true
jsonrpsee-types.workspace = true
listenfd.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-no-provider"] }
rmcp = { workspace = true, features = [
  "client",
  "transport-io",
  "transport-streamable-http-server",
  "transport-streamable-http-client-reqwest",
  "reqwest",
] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
schemars.workspace = true
sd-notify.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
toasty = { workspace = true, features = ["sqlite", "serde"] }
toasty-core.workspace = true
toasty-driver-sqlite.workspace = true
tokio = { workspace = true, features = [
  "fs",
  "io-util",
  "io-std",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tokio-util = { workspace = true, features = ["compat", "rt"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url.workspace = true
uuid = { workspace = true, features = ["v4"] }
viz-client.workspace = true
viz-config.workspace = true

[lints]
workspace = true
