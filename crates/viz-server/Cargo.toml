[package]
name = "viz-server"
description = "Durable ACP threads and delegation across viz environments"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
tokio-stream = { workspace = true, features = ["sync"] }
anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
clap = { workspace = true, features = ["derive"] }
config.workspace = true
futures.workspace = true
futures-util = { workspace = true, features = ["sink"] }
jsonrpsee-types.workspace = true
listenfd.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-no-provider"] }
rusqlite.workspace = true
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
schemars.workspace = true
sd-notify.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
  "fs",
  "io-util",
  "io-std",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tokio-util = { workspace = true, features = ["compat", "rt"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url.workspace = true
uuid = { workspace = true, features = ["v4"] }
viz-acp.workspace = true
viz-core.workspace = true
viz-git.workspace = true
viz-github.workspace = true
viz-protocol.workspace = true
viz-config.workspace = true
viz-terminal = { workspace = true, features = ["pty"] }

[lints]
workspace = true
