[package]
name = "viz-client"
description = "Client for the viz server's JSON-RPC-over-WebSocket protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytes.workspace = true
futures-util = { workspace = true, features = ["sink"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tracing.workspace = true
viz-config.workspace = true
viz-protocol.workspace = true

[lints]
workspace = true
