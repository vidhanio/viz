[package]
name = "viz-client"
description = "Client for the viz backend's JSON-RPC-over-WebSocket protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
futures-util = { workspace = true, features = ["sink"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync"] }
# `https://` backends (e.g. behind `tailscale serve`) connect over `wss://`; `ring` is rustls' process-wide
# crypto provider (tokio-tungstenite enables none).
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tracing.workspace = true
viz-config.workspace = true

[lints]
workspace = true
