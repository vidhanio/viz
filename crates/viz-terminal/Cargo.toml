[package]
name = "viz-terminal"
description = "Terminal emulation and environment-owned PTY sessions for viz"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["emulator"]
emulator = ["dep:libghostty-vt", "dep:thiserror"]
pty = ["emulator", "dep:pty-process", "dep:rustix", "dep:tokio", "uuid/v4"]

[dependencies]
viz-protocol.workspace = true
libghostty-vt = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
pty-process = { workspace = true, features = ["async"], optional = true }
rustix = { workspace = true, features = [
  "process",
  "termios",
], optional = true }
tokio = { workspace = true, features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "sync",
  "time",
], optional = true }

[lints]
workspace = true
