[package]
name = "viz-desktop"
description = "viz desktop app (Rune)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap = { workspace = true, features = ["derive"] }
fontique.workspace = true
lucide-static-svg.workspace = true
mime_guess.workspace = true
rfd = { workspace = true, features = ["xdg-portal", "wayland"] }
rune = { workspace = true, features = ["native-file-dialog"] }
rune-fx.workspace = true
rune-kit = { workspace = true, features = ["markdown", "mermaid", "math"] }
rune-notify.workspace = true
serde = { workspace = true, features = ["derive"] }
serde-saphyr.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid = { workspace = true, features = ["v4"] }
viz-client.workspace = true
viz-config.workspace = true
wgpu.workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
notify-rust = { workspace = true, features = ["z-with-tokio"] }

[lints]
workspace = true
