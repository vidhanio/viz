# Copy to ~/.config/viz/config.toml ($XDG_CONFIG_HOME/viz/config.toml).
# One file for every viz program; each reads only its own table (clients also read [client]) and ignores the rest.
# Override the path with $VIZ_SERVER_CONFIG, $VIZ_DESKTOP_CONFIG or $VIZ_CLI_CONFIG
# (or --config). A missing file or table uses defaults.
# With Home Manager, use programs.viz.settings instead.
#
# Secrets accept "inline", { file = "/run/secrets/x" } (one trailing line ending
# is removed), or { env = "NAME" }. Prefer file or env for real credentials.

[client.server]
# Shared by every client (desktop, CLI): the server to connect to.
# Defaults to the local 0600 Unix domain socket ($XDG_RUNTIME_DIR/viz/rpc.sock,
# falling back to $TMPDIR/viz/rpc.sock on macOS or <state_dir>/rpc.sock).
# socket = "/run/user/1000/viz/rpc.sock"
# For TCP servers, set url (mutually exclusive with socket) and a bearer token.
# Non-loopback URLs must use HTTPS.
# url = "https://viz.example.com"
# token = { file = "/run/secrets/viz-token" }

[server]
# Local clients connect over a private 0600 Unix socket by default
# ($XDG_RUNTIME_DIR/viz/rpc.sock, falling back to $TMPDIR/viz/rpc.sock on macOS
# or <state_dir>/rpc.sock).
# socket = "/run/user/1000/viz/rpc.sock"
# Optional TCP listener for remote clients or peer environments. Put an HTTPS
# reverse proxy in front of this listener for remote hosts. Always requires
# server.token and/or per-peer accept credentials.
# listen = "127.0.0.1:7420"
# token = { file = "/run/secrets/viz-token" }
# State storage: $STATE_DIRECTORY under systemd, otherwise $XDG_STATE_HOME/viz
# (default ~/.local/state/viz).
# state_dir = "/var/lib/viz"
# Stable identity; required to differ from every linked environment's ID.
# environment = "workstation"
# Default folder-picker directory (default $HOME).
# Each projectless thread gets a private folder under the server state directory.
# Use a state directory outside Git checkouts to enable projectless threads.
# cwd = "/home/me"
# A sole harness is the implicit default. With several, set this or select per thread.
# default_harness = "claude"

# Configure peers in both directions for remote delegation.
# - `token` is the outbound bearer token sent to the peer (matching that peer's `accept`).
# - `accept` is the unique inbound bearer token accepted from this peer (requires `listen`).
# [server.environments.lab]
# url = "https://lab.example.com"
# token = { file = "/run/secrets/viz-lab-outbound" }
# accept = { file = "/run/secrets/viz-lab-inbound" }

# Trusted ACP runners run under the server account and own their model credentials.
# viz does not add a sandbox or interactive permission policy.
# [server.harnesses.claude]
# Display name for selectors; the table key is still used in requests. Omit to show the key.
# name = "Claude Code"
# Required executable on PATH or an absolute path.
# command = "claude-agent-acp"
# Arguments, default []; extra environment (Secret values), default {}.
# Only the runner's own credentials and its explicitly configured extra environment are used.
# env.ANTHROPIC_API_KEY = { env = "ANTHROPIC_API_KEY" }
# Optional defaults; if unset, use the runner's values. Use values reported by
# the runner. Thread choices take precedence over these defaults.
# model = "claude-opus-5-5"
# effort = "high"
# [server.harnesses.codex]
# name = "Codex"
# command = "codex-acp"
# [server.harnesses.omp]
# name = "Oh My Pi"
# command = "omp"
# args = ["acp"]

[desktop.theme]
# Follows the system appearance. Pick a built-in base16 scheme for each side.
# Defaults: dark = "github-dark", light = "github".
dark = "tokyo-night-dark"
light = "tokyo-night-light"

# For a custom side, remove its built-in key above. Set `file` under
# [desktop.theme.dark] or [desktop.theme.light] to load tinted-theming YAML, or
# supply a nested [desktop.theme.dark.colors] or [desktop.theme.light.colors]
# table with all 16 keys base00 through base0F, each a "#RRGGBB" string.
# [desktop.theme.dark]
# file = "~/.config/viz/themes/mine.yaml"
