# Copy to connectors/discord.toml in $VIZ_CONFIG_DIR or $XDG_CONFIG_HOME/viz
# (default ~/.config/viz). --config overrides $VIZ_DISCORD_CONFIG, then the
# default path. No config.d/ layers. A missing file uses defaults, but the
# connector cannot run without its credentials and allowlist.

# Required Discord bot token (no default). Enable the Message Content intent
# in the Discord Developer Portal. Secrets accept "inline",
# { file = "/run/secrets/x" } (one trailing line ending is removed), or { env = "NAME" }.
bot_token = { env = "DISCORD_TOKEN" }
# Discord user IDs whose DMs and mentions are forwarded. Default []; must be non-empty.
allowed_users = [123456789012345678]
# Destination thread on the selected environment.
thread = 42
# environment = "workstation"

[backend]
# Defaults to http://127.0.0.1:7420. Non-loopback URLs use HTTPS and need a token.
# url = "https://viz.example.com"
# token = { file = "/run/secrets/viz-token" }
