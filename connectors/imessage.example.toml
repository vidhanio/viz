# iMessage connector scaffold. Copy to connectors/imessage.toml in $VIZ_CONFIG_DIR
# or $XDG_CONFIG_HOME/viz (default ~/.config/viz). --config overrides
# $VIZ_IMESSAGE_CONFIG, then the default path. No config.d/ layers. A missing
# file uses defaults, but the connector still requires these top-level settings.

# Required BlueBubbles server URL (no default).
server_url = "https://bluebubbles.example.com"
# Required BlueBubbles server password (no default). Secrets accept "inline",
# { file = "/run/secrets/x" } (one trailing line ending is removed), or { env = "NAME" }.
password = { file = "/run/secrets/bluebubbles" }
# Phone numbers or Apple IDs whose messages are forwarded. Default []; must be non-empty.
allowed_handles = ["+15555550123"]
# environment = "workstation"

[backend]
# Defaults to http://127.0.0.1:7420. Non-loopback URLs use HTTPS and need a token.
# url = "https://viz.example.com"
# token = { file = "/run/secrets/viz-token" }
