# Copy to desktop.toml in $VIZ_CONFIG_DIR or $XDG_CONFIG_HOME/viz (default ~/.config/viz).
# --config overrides $VIZ_DESKTOP_CONFIG, then the default path. No config.d/ layers;
# a missing file uses defaults.
[backend]
# Default: $XDG_RUNTIME_DIR/viz/backend.sock, or backend.sock in $STATE_DIRECTORY
# or $XDG_STATE_HOME/viz (default ~/.local/state/viz) if runtime dir is unset.
# For a custom socket, use the same path as the backend's [backend].socket.
# socket = "/run/user/1000/viz/backend.sock"
# Remote base URL and bearer token both default to unset. A URL takes precedence
# over the socket and requires an explicit client token (no backend config fallback).
# url = "https://viz-host.tailnet.ts.net"
# Secrets accept "inline", { file = "/run/secrets/x" } (one trailing line ending
# is removed), or { env = "NAME" }.
# token = { file = "/run/secrets/viz-token" }

[theme]
# Follows the system appearance. Pick a built-in base16 scheme for each side.
# Defaults: dark = "github-dark", light = "github".
dark = "tokyo-night-dark"
light = "tokyo-night-light"

# For a custom side, remove its built-in key above. Set `file` under
# [theme.dark] or [theme.light] to load tinted-theming YAML, or supply a nested
# [theme.dark.colors] or [theme.light.colors] table with all 16 keys base00
# through base0F, each a "#RRGGBB" string.
# [theme.dark]
# file = "~/.config/viz/themes/mine.yaml"
